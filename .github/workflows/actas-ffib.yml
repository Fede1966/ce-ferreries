# Importación de actas de la FFIB en ceferreries.app.
# SIN PROGRAMACIÓN: la FFIB no entrega el PDF de las actas a programas automáticos y oculta
# los marcadores de su web, así que esto solo se volverá a activar si la FFIB da un acceso
# oficial. Mientras tanto, las actas se importan con el navegador del Mac (tareas de Claude).
# El modo «comprobar» sigue siendo útil: relee las actas ya guardadas en la app (sin tocar la FFIB).
name: Actas FFIB

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "comprobar = releer actas ya guardadas · prueba = buscar en la FFIB sin guardar · real = importar y guardar"
        type: choice
        options: [comprobar, prueba, simulacro, real]
        default: comprobar

concurrency:
  group: actas-ffib
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ceferreries:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: automatizacion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: automatizacion/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Importar actas
        run: node importar-actas.mjs
        env:
          MODO: ${{ github.event_name == 'schedule' && 'real' || inputs.modo }}
          FERRERIES_EMAIL: ${{ secrets.FERRERIES_EMAIL }}
          FERRERIES_PASSWORD: ${{ secrets.FERRERIES_PASSWORD }}
          ACTAS_EXCLUIDOS: ${{ secrets.ACTAS_EXCLUIDOS }}
